<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création de Questionnaire</title>
    <link rel="stylesheet" href="../../css/questionnaire.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            <img src="../../images/media/logoUnilimBlancAvecTexte.png">
            <span>Création de Questionnaire</span>
        </div>

        <div class="top-actions">
            <button id="btn-back" class="btn-blue">Retour</button>
	    <a href="#" id="logout-btn" class="small-link">Déconnexion</a>
        </div>
    </header>

    <main class="container">
        <aside class="left-panel">

            <div class="sidebar-card card-red">
                <h3>Ajout Questions</h3>
                <button id="btn-qcm" class="btn white-btn">+ QCM</button>
                <button id="btn-texte" class="btn white-btn">+ Texte</button>
                <button id="btn-echelle" class="btn white-btn">+ Échelle de notation</button>
                <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 5px;">
                    <button id="btn-reset" class="btn red-outline-btn">Tout effacer</button>
                </div>
            </div>

            <div class="sidebar-card card-red">
                <h3 class="desc-title">Description</h3>
                <input class="desc-box" placeholder="Ajoutez une description pour ce questionnaire..."></input>
            </div>

            <div class="sidebar-card card-red">
    		<h3 class="desc-title">Groupe Ciblé</h3>
    		<select id="groupe-cible" class="desc-box" style="width: 100%; cursor: pointer;">
       			<option value="BUT1">BUT1</option>
        		<option value="BUT2" selected>BUT2</option>
        		<option value="BUT3">BUT3</option>
    		</select>
    		<p class="small-hint" style="font-size: 0.8em; margin-top: 5px; color: rgba(255,255,255,0.8);">Seuls les étudiants de ce groupe pourront voir et répondre.</p>
	    </div>
        </aside>

        <section class="questionnaire-panel">
            <input class="title-box" type="text" value="Questionnaire" />
            <p class="hint">Cliquez sur un type de question pour commencer</p>
            <div id="questions-container"></div>
        </section>
    </main>

    <footer class="footer-actions">
	<button id="save-btn" class="btn red-btn">Sauvegarder</button>
	<button id="update-btn" class="btn blue-btn" style="display:none">Mettre à jour</button>
        <button id="submit-btn" class="btn red-btn">Envoyer</button>
        <button id="export-btn" class="btn blue-btn">Exporter</button>
    </footer>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/script_exportJSON.js"></script>
</body>

</html>
<footer class="container-text-center-text-muted-my-4">
    <small>© Université de Limoges</small>
  </footer>
